[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleprod"
version = "0.1.0"
description = "SimpleProd TUI and orchestrator"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.3",
    "questionary>=1.10.0",
    "rich>=12.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
simpleprod = "simpleprod.cli:main"