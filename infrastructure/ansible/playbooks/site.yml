---
- name: SimpleProd — Full site provisioning
  hosts: all
  become: true
  pre_tasks:
    - name: Verify OS compatibility
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: >-
          SimpleProd only supports Debian/Ubuntu.
          Detected: {{ ansible_os_family }}
        quiet: yes

  roles:
    - base-tools
    - user
    - ssh
    - ufw
    - fail2ban
  # Path-specific roles are applied per group:

- name: Web servers
  hosts: web
  become: true
  roles:
    - nginx_ssl
    - nodejs

- name: Database servers
  hosts: db
  become: true
  roles:
    - postgresql
    - backups

- name: App servers
  hosts: app
  become: true
  roles:
    - docker
    - nodejs