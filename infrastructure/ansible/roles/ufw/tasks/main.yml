--- # tasks/main.yml
- name: Allow SSH port
  community.general.ufw:
    rule: allow
    port: "{{ simpleprod_ssh_port }}"
    proto: tcp
  become: true

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  become: true

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
  become: true

- name: Enable UFW deny-all (after SSH is allowed — Domain 0 safety)
  community.general.ufw:
    state: enabled
    policy: deny
  become: true

- name: Verify UFW status
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  become: true