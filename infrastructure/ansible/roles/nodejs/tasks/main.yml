--- # tasks/main.yml
- name: Install nvm
  ansible.builtin.shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
  args:
    creates: /home/{{ simpleprod_user }}/.nvm/nvm.sh
  become: true
  become_user: "{{ simpleprod_user }}"

- name: Install Node.js LTS
  ansible.builtin.shell: . /home/{{ simpleprod_user }}/.nvm/nvm.sh && nvm install --lts
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ simpleprod_user }}"

- name: Install PM2 (via nvm)
  ansible.builtin.shell: |
    export NVM_DIR="/home/{{ simpleprod_user }}/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    npm install -g pm2
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ simpleprod_user }}"