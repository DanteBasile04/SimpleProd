--- # tasks/main.yml
- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes
  become: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ simpleprod_user }}"
    groups: docker
    append: yes
  become: true