name: Test
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install ansible
      - name: Run provisioning
        run: ansible-playbook -i infrastructure/ansible/inventory/production.yml infrastructure/ansible/playbooks/site.yml
      - name: Verify user
        run: id simpleprod
      - name: Verify SSH
        run: ssh -o "BatchMode=yes" -o "ConnectTimeout=5" simpleprod@localhost echo ok
      - name: Verify UFW
        run: >
          sudo ufw status | grep -q "Status: active"
      - name: Verify services
        run: systemctl is-active --quiet nginx && systemctl is-active --quiet postgresql
